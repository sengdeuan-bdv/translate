<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lao to English Document Translator</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.4.21/mammoth.browser.min.js"></script>
    <script src="https://unpkg.com/html-docx-js/dist/html-docx.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <style>
        body {
            font-family: 'Noto Sans Lao', sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        h1, h2 {
            text-align: center;
            color: #1a73e8;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 5px;
        }
        input[type="text"], textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            font-family: inherit;
        }
        textarea {
            resize: vertical;
            height: 100px;
        }
        input[type="file"] {
            border: 1px solid #ccc;
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            box-sizing: border-box;
            background-color: #f9f9f9;
        }
        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.3s;
            margin-right: 10px;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #1557b0;
        }
        button:disabled {
            background-color: #a0c1f2;
            cursor: not-allowed;
        }
        .preview-area {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 20px;
        }
        @media (min-width: 768px) {
            .preview-area {
                flex-direction: row;
            }
        }
        .preview-box {
            flex: 1;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 5px;
            background: #fafafa;
            min-height: 200px;
            max-height: 500px;
            overflow-y: auto;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            font-size: 14px;
            color: #666;
            font-weight: bold;
        }
        #loading {
            display: none;
            color: #d93025;
            font-weight: bold;
            margin-top: 10px;
            align-items: center;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #d93025;
            border-radius: 50%;
            width: 14px;
            height: 14px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Message Box */
        #messageBox {
            display: none;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: 600;
        }
        .msg-error { background-color: #fce8e6; color: #d93025; border: 1px solid #f6c2be; }
        .msg-success { background-color: #e6f4ea; color: #1e8e3e; border: 1px solid #ceead6; }
    </style>
</head>
<body>

    <h1>ລະບົບແປພາສາເອກະສານ Word (Lao to English)</h1>

    <div id="messageBox"></div>

    <div class="container" style="display: none;">
        <h2>ຕັ້ງຄ່າການແປ (Settings)</h2>
        <div class="form-group">
            <label for="customPrompt">ຄຳສັ່ງພິເສດສຳລັບການແປ (Prompt / Glossary):</label>
            <textarea id="customPrompt">ກະລຸນາແປເອກະສານ HTML ນີ້ຈາກພາສາລາວເປັນພາສາອັງກິດ. 
ຕ້ອງຮັກສາ HTML tags (ເຊັ່ນ: <b>, <i>, <h1>, <p>, <table>) ແລະ ໂຄງສ້າງເດີມໄວ້ໃຫ້ຄືເກົ່າທຸກຢ່າງ. 
ແປແຕ່ສະເພາະຂໍ້ຄວາມທີ່ຢູ່ທາງໃນ tags ເທົ່ານັ້ນ. 
ໃຊ້ຄຳສັບທາງການ. ຖ້າມີຄຳວ່າ "ສູນສຸຂະພາບ ແມ່ ແລະ ເດັກ" ໃຫ້ແປວ່າ "Maternal and Child Health Center".</textarea>
        </div>
    </div>

    <div class="container">
        <h2>ອັບໂຫຼດເອກະສານ (Import Document)</h2>
        <div class="form-group">
            <label for="uploadDoc">ເລືອກໄຟລ໌ Word (.docx):</label>
            <input type="file" id="uploadDoc" accept=".docx">
        </div>
        <button id="translateBtn" onclick="processDocument()">ເລີ່ມຕົ້ນການແປ (Translate)</button>
        <div id="loading"><span class="spinner"></span> ກຳລັງແປພາສາ, ກະລຸນາລໍຖ້າ... (ອາດໃຊ້ເວລາຈັກໜ່ອຍ)</div>
    </div>

    <div class="container">
        <h2>ຜົນໄດ້ຮັບ (Preview)</h2>
        <div class="preview-area">
            <div class="preview-box">
                <b style="color: #5f6368;">ຕົ້ນສະບັບ (Original):</b>
                <div id="originalHtml" style="margin-top: 10px; font-size: 14px;"></div>
            </div>
            <div class="preview-box">
                <b style="color: #1a73e8;">ຜົນການແປ (Translated):</b>
                <div id="translatedHtml" style="margin-top: 10px; font-size: 14px;"></div>
            </div>
        </div>
        <br>
        <button id="exportBtn" onclick="exportToWord()" disabled>ບັນທຶກເປັນໄຟລ໌ Word (Export .docx)</button>
    </div>

    <div class="footer">
        ສ້າງໂດຍ: Sengdeuan Boutdavong
    </div>

    <script>
        let rawHtml = "";
        let finalTranslatedHtml = "";
        const apiKey = ""; // API key is provided automatically by the execution environment

        // Function to display messages
        function showMessage(msg, type) {
            const msgBox = document.getElementById('messageBox');
            msgBox.textContent = msg;
            msgBox.className = type === 'error' ? 'msg-error' : 'msg-success';
            msgBox.style.display = 'block';
            
            // Hide success messages after 5 seconds
            if(type === 'success') {
                setTimeout(() => { msgBox.style.display = 'none'; }, 5000);
            }
        }

        function hideMessage() {
            document.getElementById('messageBox').style.display = 'none';
        }

        // ອ່ານໄຟລ໌ .docx ແລະ ປ່ຽນເປັນ HTML
        document.getElementById('uploadDoc').addEventListener('change', function(event) {
            hideMessage();
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const arrayBuffer = e.target.result;
                    mammoth.convertToHtml({arrayBuffer: arrayBuffer})
                        .then(displayResult)
                        .catch(handleError);
                };
                reader.readAsArrayBuffer(file);
            }
        });

        function displayResult(result) {
            rawHtml = result.value;
            document.getElementById('originalHtml').innerHTML = rawHtml;
            document.getElementById('translatedHtml').innerHTML = "";
            document.getElementById('exportBtn').disabled = true;
        }

        function handleError(err) {
            showMessage("ເກີດຂໍ້ຜິດພາດໃນການອ່ານໄຟລ໌: " + err, "error");
        }

        // Retry logic for API calls
        async function fetchWithRetry(url, options, retries = 5) {
            const delays = [1000, 2000, 4000, 8000, 16000];
            for (let i = 0; i < retries; i++) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        throw new Error(`HTTP ຂໍ້ຜິດພາດສະຖານະ: ${response.status}`);
                    }
                    return await response.json();
                } catch (err) {
                    if (i === retries - 1) throw err;
                    await new Promise(resolve => setTimeout(resolve, delays[i]));
                }
            }
        }

        // ສົ່ງ HTML ໄປໃຫ້ Gemini API ແປ
        async function processDocument() {
            hideMessage();
            const customPrompt = document.getElementById('customPrompt').value.trim();
            
            if (!rawHtml) {
                showMessage("ກະລຸນາອັບໂຫຼດໄຟລ໌ Word ທີ່ຕ້ອງການແປກ່ອນ.", "error");
                return;
            }

            document.getElementById('loading').style.display = "flex";
            document.getElementById('translateBtn').disabled = true;

            const fullPrompt = `${customPrompt}\n\nHere is the HTML content to translate:\n\n${rawHtml}`;
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;

            try {
                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [{ text: fullPrompt }]
                        }]
                    })
                });
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                let translatedText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if(!translatedText) {
                    throw new Error("ບໍ່ໄດ້ຮັບຂໍ້ມູນຕອບກັບຈາກ AI");
                }
                
                // ຕັດເຄື່ອງໝາຍ ```html ອອກ
                translatedText = translatedText.replace(/```html/g, '').replace(/```/g, '').trim();

                finalTranslatedHtml = translatedText;
                document.getElementById('translatedHtml').innerHTML = finalTranslatedHtml;
                document.getElementById('exportBtn').disabled = false;
                
                showMessage("ການແປພາສາສຳເລັດແລ້ວ! ທ່ານສາມາດກົດບັນທຶກເປັນໄຟລ໌ Word ໄດ້ເລີຍ.", "success");

            } catch (error) {
                showMessage("ເກີດຂໍ້ຜິດພາດໃນການແປພາສາ: " + error.message, "error");
            } finally {
                document.getElementById('loading').style.display = "none";
                document.getElementById('translateBtn').disabled = false;
            }
        }

        // ສ້າງໄຟລ໌ .docx ໃໝ່ຈາກ HTML
        function exportToWord() {
            if (!finalTranslatedHtml) {
                showMessage("ຍັງບໍ່ມີຂໍ້ມູນທີ່ແປແລ້ວ.", "error");
                return;
            }
            
            // ຫໍ່ຫຸ້ມ HTML ເພື່ອໃຫ້ຮອງຮັບການ export ເປັນ Word ໄດ້ດີຂຶ້ນ
            const contentForWord = `
                <!DOCTYPE html>
                <html>
                <head>
                    <meta charset="UTF-8">
                    <style>
                        body { font-family: 'Times New Roman', Arial, sans-serif; }
                        h1, h2, h3, h4 { color: #333333; }
                        p { line-height: 1.5; }
                    </style>
                </head>
                <body>
                    ${finalTranslatedHtml}
                </body>
                </html>
            `;

            try {
                const converted = htmlDocx.asBlob(contentForWord);
                saveAs(converted, "Translated_Document.docx");
                showMessage("ດາວໂຫຼດໄຟລ໌ສຳເລັດແລ້ວ!", "success");
            } catch(e) {
                showMessage("ເກີດຂໍ້ຜິດພາດໃນການສ້າງໄຟລ໌ Word: " + e.message, "error");
            }
        }
    </script>
</body>
</html>
