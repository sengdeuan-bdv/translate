<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບແປເອກະສານ Word ລາວ ⇄ ອັງກິດ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Lao"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .doc-preview {
            background: white;
            color: black;
            font-family: 'Noto Sans Lao', sans-serif;
            line-height: 1.6;
        }
        .doc-preview table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .doc-preview th, .doc-preview td { border: 1px solid #ddd; padding: 8px; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <header class="bg-indigo-700 text-white p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" /></svg>
                AI Document Translator
            </h1>
            <div class="flex items-center gap-4">
                <div id="apiStatus" class="flex items-center gap-1 text-xs bg-indigo-800 px-2 py-1 rounded">
                    <span class="w-2 h-2 rounded-full bg-yellow-400" id="statusDot"></span>
                    <span id="statusText">ກຳລັງກວດສອບ API</span>
                </div>
                <span class="text-xs opacity-75">Multi-Model Support</span>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Sidebar Controls -->
        <div class="lg:col-span-4 space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-center mb-2">
                    <label class="block text-sm font-semibold text-gray-700">ຕັ້ງຄ່າ API Key</label>
                    <div class="flex gap-2">
                        <a href="https://aistudio.google.com/app/apikey" target="_blank" class="text-[10px] text-indigo-600 bg-indigo-50 px-2 py-1 rounded border border-indigo-100 hover:bg-indigo-100 transition-colors flex items-center gap-1">
                            ເອົາ Key ຢູ່ AI Studio
                        </a>
                        <button id="toggleApiBtn" class="text-xs text-indigo-600 hover:underline">ແກ້ໄຂ</button>
                    </div>
                </div>
                
                <div id="apiInputGroup" class="space-y-2 hidden">
                    <input type="password" id="apiKeyInput" class="w-full p-2 border border-gray-300 rounded-lg text-xs" placeholder="ວາງ API Key ຂອງທ່ານທີ່ນີ້"/>
                </div>
                
                <div id="apiInfoDisplay" class="text-xs text-green-600 bg-green-50 p-2 rounded border border-green-100 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04kM12 21.355r2.263-1.41a12.02 12.02 0 003.024-3.024L12 21.355z" /></svg>
                    ພ້ອມໃຊ້ງານ
                </div>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">1. ເລືອກໄຟລ໌ Word (.docx)</label>
                <input type="file" id="fileInput" accept=".docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">2. ທິດທາງການແປ</label>
                <select id="langDirection" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white">
                    <option value="lo2en">ລາວ ➔ ອັງກິດ (Lao to English)</option>
                    <option value="en2lo">ອັງກິດ ➔ ລາວ (English to Lao)</option>
                </select>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">3. ຄຳແນະນຳເພີ່ມເຕີມ</label>
                <textarea id="promptExtra" rows="3" class="w-full p-2 border border-gray-300 rounded-lg text-sm" placeholder="ຕົວຢ່າງ: ແປແບບເປັນທາງການ..."></textarea>
            </div>

            <button id="translateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-md disabled:bg-gray-400">
                ເລີ່ມຕົ້ນການແປ
            </button>

            <div id="downloadArea" class="hidden">
                <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center gap-2">
                    ດາວໂຫຼດໄຟລ໌ (.doc)
                </button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="lg:col-span-8 space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-100 px-4 py-2 text-xs font-bold text-gray-500 uppercase border-b">ຕົ້ນສະບັບ</div>
                <div id="originalPreview" class="p-6 h-[300px] overflow-y-auto doc-preview text-sm flex items-center justify-center italic text-gray-400">
                    ຍັງບໍ່ມີການອັບໂຫຼດໄຟລ໌
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-indigo-50 px-4 py-2 text-xs font-bold text-indigo-600 uppercase border-b">ຜົນການແປ</div>
                <div id="translatedPreview" class="p-6 h-[400px] overflow-y-auto doc-preview text-sm flex items-center justify-center italic text-gray-400">
                    ຜົນການແປຈະສະແດງຢູ່ບ່ອນນີ້
                </div>
            </div>
        </div>
    </main>

    <div id="errorToast" class="fixed bottom-5 right-5 bg-red-600 text-white px-6 py-3 rounded-lg shadow-2xl transform translate-y-24 transition-transform duration-300">
        <span id="errorMsg"></span>
    </div>

    <script>
        const apiKeyEnv = ""; 
        let customApiKey = localStorage.getItem('user_gemini_key') || ""; 
        let sourceHtml = "";
        let translatedHtml = "";

        const els = {
            fileInput: document.getElementById('fileInput'),
            translateBtn: document.getElementById('translateBtn'),
            originalPreview: document.getElementById('originalPreview'),
            translatedPreview: document.getElementById('translatedPreview'),
            downloadArea: document.getElementById('downloadArea'),
            downloadBtn: document.getElementById('downloadBtn'),
            langDirection: document.getElementById('langDirection'),
            promptExtra: document.getElementById('promptExtra'),
            errorToast: document.getElementById('errorToast'),
            errorMsg: document.getElementById('errorMsg'),
            apiKeyInput: document.getElementById('apiKeyInput'),
            toggleApiBtn: document.getElementById('toggleApiBtn'),
            apiInputGroup: document.getElementById('apiInputGroup'),
            apiInfoDisplay: document.getElementById('apiInfoDisplay'),
            statusDot: document.getElementById('statusDot'),
            statusText: document.getElementById('statusText')
        };

        if (customApiKey) {
            els.apiKeyInput.value = customApiKey;
            els.apiInfoDisplay.innerText = "ໃຊ້ Custom API Key";
        }

        els.toggleApiBtn.onclick = () => {
            if (els.apiInputGroup.classList.contains('hidden')) {
                els.apiInputGroup.classList.remove('hidden');
                els.apiInfoDisplay.classList.add('hidden');
                els.toggleApiBtn.innerText = "ບັນທຶກ";
            } else {
                customApiKey = els.apiKeyInput.value.trim();
                localStorage.setItem('user_gemini_key', customApiKey);
                els.apiInputGroup.classList.add('hidden');
                els.apiInfoDisplay.classList.remove('hidden');
                els.toggleApiBtn.innerText = "ແກ້ໄຂ";
                checkApiStatus();
            }
        };

        function checkApiStatus() {
            if (customApiKey || apiKeyEnv) {
                els.statusDot.className = "w-2 h-2 rounded-full bg-green-400";
                els.statusText.innerText = "API ພ້ອມແລ້ວ";
            } else {
                els.statusDot.className = "w-2 h-2 rounded-full bg-yellow-400";
                els.statusText.innerText = "ກະລຸນາໃສ່ API Key";
            }
        }
        checkApiStatus();

        els.fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const result = await mammoth.convertToHtml({ arrayBuffer: event.target.result });
                    sourceHtml = result.value;
                    els.originalPreview.innerHTML = sourceHtml;
                    els.originalPreview.classList.remove('italic', 'text-gray-400', 'items-center', 'justify-center');
                } catch (err) {
                    showToast("ອ່ານໄຟລ໌ບໍ່ໄດ້");
                }
            };
            reader.readAsArrayBuffer(file);
        };

        els.translateBtn.onclick = async () => {
            if (!sourceHtml) return showToast("ເລືອກໄຟລ໌ກ່ອນ");
            const key = customApiKey || apiKeyEnv;
            if (!key) return showToast("ກະລຸນາວາງ API Key ຂອງທ່ານກ່ອນ");

            els.translateBtn.disabled = true;
            els.translateBtn.innerText = "ກຳລັງແປ...";
            els.translatedPreview.innerHTML = `<div class="loading-shimmer h-8 w-full mb-4 rounded"></div><div class="loading-shimmer h-24 w-full rounded"></div>`;

            const direction = els.langDirection.value;
            const target = direction === 'lo2en' ? 'English' : 'Lao';
            const systemPrompt = `Translate this HTML to ${target}. Keep all HTML structure exactly the same. Only translate text inside tags. No preamble, no markdown code blocks. Result must be pure HTML. ${els.promptExtra.value}`;

            // List of model endpoints and versions to try for maximum compatibility
            const endpoints = [
                { version: 'v1beta', model: 'gemini-1.5-flash' },
                { version: 'v1', model: 'gemini-pro' },
                { version: 'v1beta', model: 'gemini-1.5-flash-8b' }
            ];

            let lastError = "";

            for (const ep of endpoints) {
                try {
                    const url = `https://generativelanguage.googleapis.com/${ep.version}/models/${ep.model}:generateContent?key=${key}`;
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: sourceHtml }] }],
                            // Note: Some older models might not support systemInstruction, so we move it to the prompt if needed
                            // For v1beta/1.5-flash it works as below:
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    const data = await response.json();
                    if (!response.ok) throw new Error(data.error?.message || "Error");

                    let result = data.candidates[0].content.parts[0].text;
                    translatedHtml = result.replace(/```html|```/gi, '').trim();
                    els.translatedPreview.innerHTML = translatedHtml;
                    els.translatedPreview.classList.remove('italic', 'text-gray-400', 'items-center', 'justify-center');
                    els.downloadArea.classList.remove('hidden');
                    els.translateBtn.disabled = false;
                    els.translateBtn.innerText = "ເລີ່ມຕົ້ນການແປ";
                    return; // Stop after first success
                } catch (err) {
                    lastError = err.message;
                    console.log(`Endpoint ${ep.model} (${ep.version}) failed: ${err.message}`);
                }
            }

            showToast("ແປບໍ່ໄດ້: " + lastError);
            els.translatedPreview.innerHTML = `<div class="text-red-500 p-4 border border-red-200 rounded-lg bg-red-50">
                <strong>ຂໍ້ຜິດພາດ:</strong> ${lastError}<br><br>
                <p class="text-xs">ຄຳແນະນຳ: ໃຫ້ແນ່ໃຈວ່າ API Key ຂອງທ່ານມາຈາກ <a href="https://aistudio.google.com/" target="_blank" class="underline">Google AI Studio</a> ແລະ ມີສະຖານະ Active.</p>
            </div>`;
            els.translateBtn.disabled = false;
            els.translateBtn.innerText = "ເລີ່ມຕົ້ນການແປ";
        };

        els.downloadBtn.onclick = () => {
            const blob = new Blob(['\ufeff', `<html><head><meta charset="utf-8"></head><body>${translatedHtml}</body></html>`], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = 'translated_doc.doc';
            a.click();
        };

        function showToast(msg) {
            els.errorMsg.innerText = msg;
            els.errorToast.classList.remove('translate-y-24');
            setTimeout(() => els.errorToast.classList.add('translate-y-24'), 5000);
        }
    </script>
</body>
</html>
