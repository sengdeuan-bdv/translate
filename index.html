<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບແປເອກະສານ Word ລາວ ⇄ ອັງກິດ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Lao"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <style>
        .doc-preview {
            background: white;
            color: black;
            font-family: 'Noto Sans Lao', sans-serif;
            line-height: 1.6;
        }
        .doc-preview table { width: 100%; border-collapse: collapse; margin: 1rem 0; }
        .doc-preview th, .doc-preview td { border: 1px solid #ddd; padding: 8px; }
        .loading-shimmer {
            background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <header class="bg-indigo-700 text-white p-4 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" /></svg>
                AI Document Translator
            </h1>
            <span class="text-xs bg-indigo-800 px-2 py-1 rounded">Gemini 2.5 Flash</span>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-6">
        <!-- Sidebar Controls -->
        <div class="lg:col-span-4 space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">1. ເລືອກໄຟລ໌ Word (.docx)</label>
                <input type="file" id="fileInput" accept=".docx" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">2. ທິດທາງການແປ</label>
                <select id="langDirection" class="w-full p-2 border border-gray-300 rounded-lg text-sm bg-white">
                    <option value="lo2en">ລາວ ➔ ອັງກິດ (Lao to English)</option>
                    <option value="en2lo">ອັງກິດ ➔ ລາວ (English to Lao)</option>
                </select>
            </div>

            <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-200">
                <label class="block text-sm font-semibold text-gray-700 mb-2">3. ຄຳແນະນຳເພີ່ມເຕີມ (Option)</label>
                <textarea id="promptExtra" rows="3" class="w-full p-2 border border-gray-300 rounded-lg text-sm" placeholder="ຕົວຢ່າງ: ແປແບບເປັນທາງການ, ໃຊ້ຄຳສັບທາງການແພດ..."></textarea>
            </div>

            <button id="translateBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl transition-all shadow-md disabled:bg-gray-400">
                ເລີ່ມຕົ້ນການແປ
            </button>

            <div id="downloadArea" class="hidden">
                <button id="downloadBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl transition-all shadow-md flex justify-center items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                    ດາວໂຫຼດໄຟລ໌ (.doc)
                </button>
            </div>
        </div>

        <!-- Preview Area -->
        <div class="lg:col-span-8 space-y-4">
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-gray-100 px-4 py-2 text-xs font-bold text-gray-500 uppercase border-b">ຕົ້ນສະບັບ</div>
                <div id="originalPreview" class="p-6 h-[300px] overflow-y-auto doc-preview text-sm text-gray-400 italic text-center flex items-center justify-center">
                    ຍັງບໍ່ມີການອັບໂຫຼດໄຟລ໌
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                <div class="bg-indigo-50 px-4 py-2 text-xs font-bold text-indigo-600 uppercase border-b">ຜົນການແປ</div>
                <div id="translatedPreview" class="p-6 h-[400px] overflow-y-auto doc-preview text-sm">
                    <div class="text-gray-400 italic text-center h-full flex items-center justify-center">ຜົນການແປຈະສະແດງຢູ່ບ່ອນນີ້</div>
                </div>
            </div>
        </div>
    </main>

    <!-- Error Toast -->
    <div id="errorToast" class="fixed bottom-5 right-5 bg-red-600 text-white px-6 py-3 rounded-lg shadow-2xl transform translate-y-20 transition-transform duration-300 flex items-center gap-3">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span id="errorMsg"></span>
    </div>

    <script>
        // ໝາຍເຫດ: apiKey ຈະຖືກແທນທີ່ດ້ວຍຄ່າຕົວຈິງຈາກສະພາບແວດລ້ອມ Canvas ໂດຍອັດຕະໂນມັດ
        const apiKey = ""; 
        let sourceHtml = "";
        let translatedHtml = "";

        const els = {
            fileInput: document.getElementById('fileInput'),
            translateBtn: document.getElementById('translateBtn'),
            originalPreview: document.getElementById('originalPreview'),
            translatedPreview: document.getElementById('translatedPreview'),
            downloadArea: document.getElementById('downloadArea'),
            downloadBtn: document.getElementById('downloadBtn'),
            langDirection: document.getElementById('langDirection'),
            promptExtra: document.getElementById('promptExtra'),
            errorToast: document.getElementById('errorToast'),
            errorMsg: document.getElementById('errorMsg')
        };

        // ຟັງຊັນສຳລັບການລອງໃໝ່ເມື່ອເກີດ Error ດ້ວຍ Exponential Backoff ທີ່ແຂງແຮງຂຶ້ນ
        async function fetchWithRetry(url, options, retries = 5, backoff = 1000) {
            // ກວດສອບກ່ອນວ່າ API Key ມີຄ່າຫຼືບໍ່ (ເພື່ອປ້ອງກັນ "unregistered callers")
            const currentKey = apiKey || "";
            const finalUrl = url.includes("key=") ? url : `${url}&key=${currentKey}`;

            try {
                const response = await fetch(finalUrl, options);
                
                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    const errorCode = response.status;
                    const errorMsg = errorData.error?.message || "Unknown error";

                    // ຖ້າເປັນ 403 (Forbidden) ຫຼື 401 (Unauthorized) ຫຼື 429 (Rate Limit)
                    if ([401, 403, 429].includes(errorCode)) {
                        if (retries > 0) {
                            console.log(`Retrying due to ${errorCode}... ${retries} attempts left.`);
                            await new Promise(resolve => setTimeout(resolve, backoff));
                            return fetchWithRetry(url, options, retries - 1, backoff * 1.5);
                        }
                    }
                    throw new Error(`${errorCode}: ${errorMsg}`);
                }
                return await response.json();
            } catch (err) {
                if (retries > 0 && !err.message.includes("400")) {
                    await new Promise(resolve => setTimeout(resolve, backoff));
                    return fetchWithRetry(url, options, retries - 1, backoff * 1.5);
                }
                throw err;
            }
        }

        els.fileInput.onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async (event) => {
                try {
                    const arrayBuffer = event.target.result;
                    const result = await mammoth.convertToHtml({ arrayBuffer });
                    sourceHtml = result.value;
                    els.originalPreview.innerHTML = sourceHtml;
                    els.originalPreview.classList.remove('text-center', 'items-center', 'italic');
                } catch (err) {
                    showToast("ບໍ່ສາມາດອ່ານໄຟລ໌ Word ໄດ້: " + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        };

        els.translateBtn.onclick = async () => {
            if (!sourceHtml) return showToast("ກະລຸນາເລືອກໄຟລ໌ກ່ອນ");

            els.translateBtn.disabled = true;
            els.translateBtn.innerText = "ກຳລັງແປ...";
            els.translatedPreview.innerHTML = `
                <div class="space-y-4">
                    <div class="h-4 bg-gray-200 rounded w-3/4 loading-shimmer"></div>
                    <div class="h-4 bg-gray-200 rounded w-1/2 loading-shimmer"></div>
                    <div class="h-4 bg-gray-200 rounded w-5/6 loading-shimmer"></div>
                    <p class="text-xs text-indigo-500 animate-pulse text-center">AI ກຳລັງວິເຄາະ ແລະ ແປເນື້ອຫາ...</p>
                </div>`;

            const direction = els.langDirection.value;
            const srcLang = direction === 'lo2en' ? 'Lao' : 'English';
            const tgtLang = direction === 'lo2en' ? 'English' : 'Lao';
            
            const systemPrompt = `You are a professional ${srcLang} to ${tgtLang} translator. 
            Translate the HTML content provided. Keep all HTML tags intact. 
            Only translate the text nodes. Do not add any explanation or markdown code blocks. 
            Keep the output as pure HTML content.
            ${els.promptExtra.value ? "Additional Instructions: " + els.promptExtra.value : ""}`;

            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`;
            
            try {
                const data = await fetchWithRetry(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: sourceHtml }] }],
                        systemInstruction: { parts: [{ text: systemPrompt }] }
                    })
                });

                if (!data.candidates || data.candidates.length === 0) {
                    throw new Error("AI ບໍ່ສາມາດສ້າງຄຳຕອບໄດ້ໃນຂະນະນີ້.");
                }

                let resultText = data.candidates[0].content.parts[0].text;
                // ທຳຄວາມສະອາດຫາກ AI ສົ່ງ Markdown code blocks ມາ
                resultText = resultText.replace(/```html/gi, '').replace(/```/g, '').trim();
                
                translatedHtml = resultText;
                els.translatedPreview.innerHTML = translatedHtml;
                els.downloadArea.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                let displayError = err.message;
                if (err.message.includes("403") || err.message.includes("401")) {
                    displayError = "API Key ບໍ່ຖືກຕ້ອງ ຫຼື ຍັງບໍ່ທັນຖືກເປີດໃຊ້ງານ. ກະລຸນາລອງ Refresh ຫນ້າເວັບຄືນໃໝ່.";
                }
                showToast("ເກີດຂໍ້ຜິດພາດ: " + displayError);
                els.translatedPreview.innerHTML = `<div class="text-red-500 italic p-4 border border-red-100 rounded-lg bg-red-50">ບໍ່ສາມາດແປໄດ້: ${displayError}</div>`;
            } finally {
                els.translateBtn.disabled = false;
                els.translateBtn.innerText = "ເລີ່ມຕົ້ນການແປ";
            }
        };

        els.downloadBtn.onclick = () => {
            const blob = new Blob(['\ufeff', `<html><head><meta charset="utf-8"><style>body{font-family:'Noto Sans Lao', sans-serif;}</style></head><body>${translatedHtml}</body></html>`], {
                type: 'application/msword'
            });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `translated_${new Date().getTime()}.doc`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        };

        function showToast(msg) {
            els.errorMsg.innerText = msg;
            els.errorToast.classList.remove('translate-y-20');
            setTimeout(() => {
                els.errorToast.classList.add('translate-y-20');
            }, 6000);
        }
    </script>
</body>
</html>
