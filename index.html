<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ລະບົບແປເອກະສານ Word ລາວ ⇄ ອັງກິດ</title>
    
    <!-- ເພີ່ມ Font Noto Sans Lao ຈາກ Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Noto Sans Lao"', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>

    <style>
        .doc-preview {
            background: white;
            color: black;
            font-family: 'Noto Sans Lao', 'Times New Roman', Times, serif;
            line-height: 1.6;
            overflow-x: auto;
        }
        .doc-preview h1 { font-size: 1.8em; font-weight: bold; margin-bottom: 0.5em; margin-top: 1em; }
        .doc-preview h2 { font-size: 1.5em; font-weight: bold; margin-bottom: 0.5em; margin-top: 1em; }
        .doc-preview h3 { font-size: 1.2em; font-weight: bold; margin-bottom: 0.5em; margin-top: 1em; }
        .doc-preview h4 { font-size: 1.1em; font-weight: bold; color: #2563eb; margin-top: 1em; border-bottom: 1px solid #e2e8f0; padding-bottom: 4px;}
        .doc-preview p { margin-bottom: 1em; }
        .doc-preview table { width: 100%; border-collapse: collapse; margin-bottom: 1.5em; white-space: nowrap; }
        .doc-preview th, .doc-preview td { border: 1px solid #cbd5e1; padding: 8px; text-align: left; }
        .doc-preview th { background-color: #f8fafc; font-weight: bold; }
        .doc-preview ul { list-style-type: disc; margin-left: 20px; margin-bottom: 1em; }
        .doc-preview ol { list-style-type: decimal; margin-left: 20px; margin-bottom: 1em; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800 font-sans">

    <header class="bg-blue-700 text-white shadow-md py-4 px-6 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                <h1 class="text-2xl font-bold">ເຄື່ອງມືແປເອກະສານ Word ລາວ <span class="mx-1">⇄</span> ອັງກິດ</h1>
            </div>
            <div class="text-sm font-medium bg-blue-800 px-3 py-1 rounded-full border border-blue-600">
                ຂັບເຄື່ອນໂດຍ Gemini 2.5
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <div class="lg:col-span-4 space-y-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold flex items-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2 text-blue-600"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M12 12v6"/><path d="m15 15-3-3-3 3"/></svg>
                    1. ອັບໂຫຼດເອກະສານ (Word)
                </h2>
                <div class="border-2 border-dashed border-slate-300 rounded-lg p-6 text-center hover:bg-slate-50 transition-colors cursor-pointer" onclick="document.getElementById('fileInput').click()">
                    <div class="flex justify-center space-x-2 mb-2">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-8 h-8 text-blue-500"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"/><path d="M14 2v4a2 2 0 0 0 2 2h4"/><path d="M10 9H8"/><path d="M16 13H8"/><path d="M16 17H8"/></svg>
                    </div>
                    <p class="text-sm text-slate-600">ຄລິກເພື່ອເລືອກໄຟລ໌ Word</p>
                    <input type="file" id="fileInput" accept=".docx,application/vnd.openxmlformats-officedocument.wordprocessingml.document" class="hidden">
                </div>
                <div id="fileInfo" class="mt-3 text-sm text-green-600 font-medium hidden flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-1"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
                    <span id="fileName">ເລືອກໄຟລ໌ແລ້ວ</span>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold flex items-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2 text-blue-600"><path d="M8 3 4 7l4 4"/><path d="M4 7h16"/><path d="m16 21 4-4-4-4"/><path d="M20 17H4"/></svg>
                    2. ເລືອກທິດທາງການແປ
                </h2>
                <div class="flex space-x-4">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="langDirection" value="lo2en" class="text-blue-600" checked>
                        <span class="text-sm font-medium">ລາວ → ອັງກິດ</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="langDirection" value="en2lo" class="text-blue-600">
                        <span class="text-sm font-medium">ອັງກິດ → ລາວ</span>
                    </label>
                </div>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <h2 class="text-lg font-semibold flex items-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 mr-2 text-blue-600"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                    3. ຄຳແນະນຳພິເສດ (Prompt)
                </h2>
                <textarea id="customPrompt" rows="4" class="w-full p-3 border border-slate-300 rounded-lg text-sm" placeholder="ຕົວຢ່າງ: ແປເປັນທາງການ, RDQA = Routine Data Quality Assessment..."></textarea>
            </div>

            <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                <button id="translateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg flex justify-center items-center">
                    ເລີ່ມຕົ້ນການແປພາສາ
                </button>
                <div id="loadingStatus" class="mt-4 text-sm text-slate-600 hidden text-center">
                    <div class="animate-spin h-5 w-5 border-2 border-blue-600 border-t-transparent rounded-full mx-auto mb-2"></div>
                    ກຳລັງແປພາສາ...
                </div>
            </div>

            <div id="exportSection" class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 hidden border-l-4 border-l-green-500">
                <button id="exportBtn" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg flex justify-center items-center">
                    ດາວໂຫຼດເອກະສານ (.doc)
                </button>
            </div>
        </div>

        <div class="lg:col-span-8 flex flex-col space-y-4">
            <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[400px]">
                <div class="bg-slate-100 px-4 py-2 border-b font-semibold text-slate-700">ຕົ້ນສະບັບ</div>
                <div id="originalPreview" class="p-6 overflow-y-auto flex-1 doc-preview text-sm"></div>
            </div>

            <div class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden flex flex-col h-[400px]">
                <div class="bg-blue-50 px-4 py-2 border-b border-blue-100 font-semibold text-blue-800">ຜົນການແປ</div>
                <div id="translatedPreview" class="p-6 overflow-y-auto flex-1 doc-preview text-sm"></div>
            </div>
        </div>
    </main>

    <footer class="mt-12 text-center text-sm text-slate-500 pb-8">
        <p>ພັດທະນາໂດຍ: <span class="font-semibold text-blue-600">Sengdeuan Boutdavong</span></p>
    </footer>

    <div id="errorModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50 hidden">
        <div class="bg-white p-6 rounded-xl shadow-xl max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold text-center mb-2 text-red-600">ເກີດຂໍ້ຜິດພາດ</h3>
            <p id="errorMessage" class="text-sm text-slate-600 text-center mb-6"></p>
            <button onclick="document.getElementById('errorModal').classList.add('hidden')" class="w-full bg-slate-200 py-2 rounded-lg">ປິດ</button>
        </div>
    </div>

    <script>
        // ການຈັດການ API Key ແບບອັດຕະໂນມັດສຳລັບສະພາບແວດລ້ອມນີ້
        const apiKey = ""; 

        let rawOriginalHtml = "";
        let finalTranslatedHtml = "";
        const originalFileName = { name: "document" };

        const fileInput = document.getElementById('fileInput');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameDisplay = document.getElementById('fileName');
        const translateBtn = document.getElementById('translateBtn');
        const originalPreview = document.getElementById('originalPreview');
        const translatedPreview = document.getElementById('translatedPreview');
        const loadingStatus = document.getElementById('loadingStatus');
        const customPrompt = document.getElementById('customPrompt');
        const exportSection = document.getElementById('exportSection');
        const exportBtn = document.getElementById('exportBtn');
        const errorModal = document.getElementById('errorModal');
        const errorMessage = document.getElementById('errorMessage');
        const langDirectionElements = document.getElementsByName('langDirection');

        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            originalFileName.name = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
            fileNameDisplay.textContent = file.name;
            fileInfo.classList.remove('hidden');
            
            const reader = new FileReader();
            reader.onload = function(event) {
                mammoth.convertToHtml({arrayBuffer: event.target.result})
                    .then(result => {
                        rawOriginalHtml = result.value;
                        originalPreview.innerHTML = rawOriginalHtml;
                    })
                    .catch(err => showError("ບໍ່ສາມາດອ່ານໄຟລ໌ໄດ້: " + err.message));
            };
            reader.readAsArrayBuffer(file);
        });

        async function callGeminiAPI(systemInstruction, userText, retryCount = 0) {
            // ຖ້າ apiKey ຍັງເປັນຄ່າຫວ່າງ, ລະບົບອັດຕະໂນມັດຈະບໍ່ເຮັດວຽກ. 
            // ໃນສະພາບແວດລ້ອມນີ້ Key ຈະຖືກສົ່ງຜ່ານ URL parameter ໂດຍລະບົບ Preview.
            const modelName = "gemini-2.5-flash-preview-09-2025";
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{ parts: [{ text: userText }] }],
                systemInstruction: { parts: [{ text: systemInstruction }] }
            };

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    const errJson = await response.json().catch(() => ({}));
                    const msg = errJson.error?.message || response.statusText;
                    
                    if (response.status === 403) throw new Error("API Key ບໍ່ຖືກຕ້ອງ ຫຼື ບໍ່ໄດ້ຮັບອະນຸຍາດ (403)");
                    if (response.status === 429) { // Rate limit
                        if (retryCount < 5) {
                            const delay = Math.pow(2, retryCount) * 1000;
                            await new Promise(r => setTimeout(r, delay));
                            return callGeminiAPI(systemInstruction, userText, retryCount + 1);
                        }
                    }
                    throw new Error(msg);
                }

                const result = await response.json();
                return result.candidates[0].content.parts[0].text;
            } catch (error) {
                if (retryCount < 5 && !error.message.includes("403")) {
                    const delay = Math.pow(2, retryCount) * 1000;
                    await new Promise(r => setTimeout(r, delay));
                    return callGeminiAPI(systemInstruction, userText, retryCount + 1);
                }
                throw error;
            }
        }

        translateBtn.addEventListener('click', async function() {
            if (!rawOriginalHtml) return showError("ກະລຸນາອັບໂຫຼດໄຟລ໌ກ່ອນ");

            translateBtn.classList.add('hidden');
            loadingStatus.classList.remove('hidden');
            translatedPreview.innerHTML = "ກຳລັງປະມວນຜົນ...";

            let selectedDirection = 'lo2en';
            for (const rb of langDirectionElements) if (rb.checked) selectedDirection = rb.value;
            
            let src = selectedDirection === 'lo2en' ? 'Lao' : 'English';
            let tgt = selectedDirection === 'lo2en' ? 'English' : 'Lao';

            let sys = `You are a professional translator from ${src} to ${tgt}. 
            Translate the text inside the HTML tags while preserving the HTML structure perfectly. 
            Do NOT include markdown formatting. Just return the translated HTML.`;
            
            if (customPrompt.value.trim()) sys += `\nSpecial instructions: ${customPrompt.value}`;

            try {
                let translated = await callGeminiAPI(sys, rawOriginalHtml);
                translated = translated.replace(/^```html\n?/i, '').replace(/\n?```$/i, '').trim();
                finalTranslatedHtml = translated;
                translatedPreview.innerHTML = finalTranslatedHtml;
                exportSection.classList.remove('hidden');
            } catch (error) {
                showError("ການແປລົ້ມເຫຼວ: " + error.message);
                translatedPreview.innerHTML = "ເກີດຂໍ້ຜິດພາດ.";
            } finally {
                translateBtn.classList.remove('hidden');
                loadingStatus.classList.add('hidden');
            }
        });

        exportBtn.addEventListener('click', function() {
            const content = `<html><head><meta charset='utf-8'></head><body>${finalTranslatedHtml}</body></html>`;
            const blob = new Blob(['\ufeff', content], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${originalFileName.name}_Translated.doc`;
            a.click();
        });

        function showError(msg) {
            errorMessage.innerText = msg;
            errorModal.classList.remove('hidden');
        }
    </script>
</body>
</html>
